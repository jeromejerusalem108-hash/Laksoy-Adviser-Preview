
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROJECT L.A.K.A.S. | Evaluation</title>

    <!-- Age eligibility and consent access protection -->
    <script>
        (() => {
            const AGE_ELIGIBILITY_KEY =
                "project_lakas_age_eligible";

            const CONSENT_KEY =
                "project_lakas_f1_consent_v1";

            try {
                // Require confirmation of the minimum age.
                if (
                    sessionStorage.getItem(AGE_ELIGIBILITY_KEY) !== "true"
                ) {
                    window.location.replace("eligibility-draft.html");
                    return;
                }

                // Require a valid, affirmative consent record.
                let consentRecord = null;

                try {
                    consentRecord = JSON.parse(
                        sessionStorage.getItem(CONSENT_KEY) || "null"
                    );
                } catch (error) {
                    consentRecord = null;
                }

                if (
                    !consentRecord ||
                    consentRecord.consent !== "agree"
                ) {
                    window.location.replace("consent-draft.html");
                }

            } catch (error) {
                // If session storage cannot be checked, do not allow access.
                window.location.replace("eligibility-draft.html");
            }
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #f5f3ed;
            color: #263b2d;
        }

        /* Main header */

        .topbar {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 0 20px;
            background: #183b2b;
            color: white;
        }

        .topbar strong {
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .topbar select {
            max-width: 240px;
            padding: 8px 10px;
            border: 1px solid #d5dfd5;
            border-radius: 5px;
            background: white;
            color: #263b2d;
            font-size: 13px;
        }

        /* Main workspace */

        .workspace {
            display: flex;
            height: calc(100vh - 58px);
            position: relative;
        }

        /* Evaluation panel */

        .evaluation-panel {
            width: 42%;
            min-width: 340px;
            max-width: 65%;
            padding: 24px;
            background: #f8f8f5;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .panel-heading {
            margin-bottom: 22px;
        }

        .panel-heading h2 {
            margin: 0 0 7px;
            color: #183b2b;
            font-family: Georgia, serif;
            font-size: 25px;
        }

        .panel-heading p {
            margin: 0;
            color: #66746a;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Design information */

        .design-summary {
            background: white;
            border: 1px solid #e1e5dc;
            border-left: 4px solid #356347;
            border-radius: 7px;
            padding: 16px;
            margin-bottom: 22px;
        }

        .design-summary .design-name {
            color: #183b2b;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .design-summary .design-position {
            color: #68766b;
            font-size: 12px;
        }

        /* Progress */

        .progress-section {
            margin-bottom: 24px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
            color: #526257;
            font-size: 12px;
        }

        .progress-track {
            width: 100%;
            height: 7px;
            background: #e4e9e1;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #356347;
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        /* Section headings */

        .section-heading {
            margin: 26px 0 13px;
            color: #244b35;
            font-family: Georgia, serif;
            font-size: 19px;
        }

        .section-description {
            margin: 0 0 15px;
            color: #68766b;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Individual questions */

        .question-card {
            margin: 0 0 15px;
            padding: 17px;
            background: white;
            border: 1px solid #e2e6df;
            border-radius: 7px;
        }

        .question-card legend {
            display: block;
            width: 100%;
            padding: 0;
            margin-bottom: 14px;
            color: #263b2d;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.6;
        }

        .question-number {
            display: inline-block;
            margin-right: 5px;
            color: #356347;
        }

        .question-english,
        .question-tagalog {
            display: block;
        }

        .question-tagalog {
            margin-top: 4px;
            color: #65766a;
            font-weight: normal;
            font-style: italic;
        }

        /* Rating choices */

        .answer-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .answer-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            min-height: 38px;
            padding: 8px;
            background: #f5f6f1;
            border: 1px solid #e2e6df;
            border-radius: 5px;
            cursor: pointer;
            color: #45564a;
            font-size: 12px;
            line-height: 1.35;
        }

        .answer-options label:has(input:checked) {
            background: #e4eee5;
            border-color: #356347;
            color: #183b2b;
            font-weight: bold;
        }

        .answer-options input {
            margin: 0;
            accent-color: #356347;
            flex-shrink: 0;
        }

        /* Written feedback */

        .feedback-intro {
            margin: 0 0 13px;
            color: #68766b;
            font-size: 13px;
            line-height: 1.6;
        }

        .feedback-drawer {
            margin: 0 0 15px;
            background: white;
            border: 1px solid #dce4da;
            border-radius: 8px;
            overflow: hidden;
        }

        .feedback-drawer summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 16px;
            background: #eaf0e8;
            color: #183b2b;
            cursor: pointer;
            list-style: none;
        }

        .feedback-drawer summary::-webkit-details-marker {
            display: none;
        }

        .feedback-drawer summary:hover {
            background: #e1ebdf;
        }

        .feedback-drawer summary:focus-visible {
            outline: 3px solid #8eae92;
            outline-offset: -3px;
        }

        .drawer-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .drawer-title strong {
            font-family: Georgia, serif;
            font-size: 17px;
        }

        .drawer-title span {
            color: #5c7162;
            font-size: 12px;
            font-style: italic;
        }

        .drawer-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .selection-count {
            padding: 6px 9px;
            border-radius: 20px;
            background: #d7e5d5;
            color: #244b35;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .drawer-arrow {
            color: #244b35;
            font-size: 19px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .feedback-drawer[open] .drawer-arrow {
            transform: rotate(180deg);
        }

        .drawer-content {
            padding: 14px;
            border-top: 1px solid #e1e7df;
        }

        .drawer-instruction {
            margin: 0 0 12px;
            color: #68766b;
            font-size: 12px;
            line-height: 1.5;
        }

        .strength-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .strength-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px;
            background: #fafbf8;
            border: 1px solid #e2e6df;
            border-radius: 6px;
            cursor: pointer;
            color: #34483a;
            font-size: 13px;
            line-height: 1.4;
        }

        .strength-option:has(input:checked) {
            background: #eaf2e9;
            border-color: #6c9774;
        }

        .strength-option input {
            width: 16px;
            height: 16px;
            margin: 1px 0 0;
            flex-shrink: 0;
            accent-color: #356347;
        }

        .strength-option span {
            display: block;
        }

        .strength-option .option-tagalog {
            display: block;
            margin-top: 3px;
            color: #68766b;
            font-size: 12px;
            font-style: italic;
        }

        .other-response {
            margin: 9px 0 0 26px;
        }

        .other-response[hidden] {
            display: none;
        }

        .other-response label {
            display: block;
            margin-bottom: 6px;
            color: #45564a;
            font-size: 12px;
            font-weight: bold;
        }

        .other-response input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d6ddd3;
            border-radius: 5px;
            background: #fafbf8;
            color: #263b2d;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .other-response input:focus {
            outline: 2px solid #b8d0bd;
            border-color: #356347;
        }

        /* Suggested improvements */

        .comment-card {
            margin-bottom: 15px;
            padding: 17px;
            background: white;
            border: 1px solid #e2e6df;
            border-radius: 7px;
        }

        .comment-card label {
            display: block;
            margin-bottom: 5px;
            color: #263b2d;
            font-size: 14px;
            font-weight: bold;
        }

        .comment-card .tagalog-label {
            display: block;
            margin-bottom: 10px;
            color: #68766b;
            font-size: 12px;
            font-style: italic;
        }

        .comment-card textarea {
            width: 100%;
            min-height: 105px;
            resize: vertical;
            padding: 11px;
            border: 1px solid #d6ddd3;
            border-radius: 5px;
            background: #fafbf8;
            color: #263b2d;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;
        }

        .comment-card textarea:focus {
            outline: 2px solid #b8d0bd;
            border-color: #356347;
        }

        /* Save information */

        .save-status {
            margin-top: 22px;
            padding: 13px;
            background: #e9efe8;
            border-radius: 5px;
            color: #315b3e;
            font-size: 12px;
            line-height: 1.5;
        }

        /* Resizable divider */

        .divider {
            width: 12px;
            flex-shrink: 0;
            background: #e4e1d8;
            cursor: col-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .divider button {
            border: none;
            background: #183b2b;
            color: white;
            border-radius: 20px;
            width: 27px;
            height: 42px;
            cursor: pointer;
            font-size: 17px;
        }

        /* 3D model viewer */

        .model-viewer {
            flex: 1;
            min-width: 0;
            background: #eaeaea;
        }

        .model-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Collapsed desktop panel */

        .workspace.collapsed .evaluation-panel {
            display: none;
        }

        .workspace.collapsed .divider {
            width: 34px;
        }

        /* Mobile drawer */

        .drawer-toggle {
            display: none;
        }

        @media (max-width: 760px) {
            .topbar {
                height: 52px;
                padding: 0 11px;
            }

            .topbar strong {
                font-size: 12px;
            }

            .topbar select {
                max-width: 155px;
                font-size: 11px;
            }

            .workspace {
                height: calc(100dvh - 52px);
            }

            .model-viewer {
                width: 100%;
                height: 100%;
            }

            .evaluation-panel {
                position: fixed;
                top: 52px;
                right: 0;
                bottom: 0;
                width: 90%;
                max-width: 440px;
                min-width: 0;
                z-index: 20;
                padding: 20px;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                box-shadow: -5px 0 18px rgba(0,0,0,0.2);
            }

            .evaluation-panel.open {
                transform: translateX(0);
            }

            .divider {
                display: none;
            }

            .drawer-toggle {
                display: block;
                position: fixed;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                z-index: 25;
                border: none;
                border-radius: 10px 0 0 10px;
                background: #183b2b;
                color: white;
                padding: 17px 10px;
                writing-mode: vertical-rl;
                cursor: pointer;
            }

            .drawer-toggle.hidden {
                display: none;
            }
        }

        @media (max-width: 420px) {
            .answer-options {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .evaluation-panel {
                padding: 16px;
            }

            .feedback-drawer summary {
                padding: 13px 11px;
            }

            .drawer-title strong {
                font-size: 15px;
            }

            .selection-count {
                font-size: 10px;
                padding: 5px 7px;
            }
        }
    

        /* L.A.K.A.S. refinement pass */
        :root {
            --lakas-forest:#15391f; --lakas-green:#244b35; --lakas-gold:#d9a52d;

            --lakas-ink:#26352b; --lakas-line:rgba(81,69,45,.18);
        }
        body {

        body::before {

        .lakas-emblem {
            display:block;width:clamp(58px,7vw,78px);height:auto;aspect-ratio:1;
            object-fit:contain;border-radius:50%;background:var(--lakas-ivory);
            padding:3px;box-shadow:0 3px 10px rgba(0,0,0,.16)
        }
        header h1,.hero h1 {color:var(--lakas-ivory);letter-spacing:.07em;text-wrap:balance}
        h1,h2,h3 {font-family:Georgia,"Times New Roman",serif!important}

        main>section h2,.section-card h2,.eligibility-card h2 {margin-bottom:15px}
        p,li {line-height:1.8}
        p {margin-bottom:16px}
        ul,ol {padding-left:1.45rem}

        .navigation,.action {margin-top:30px}
        .navigation a,.action a,.continue-button,button,.next {

        .navigation .next,.action a,.continue-button,button,.next {
            background:var(--lakas-green)!important;color:var(--lakas-ivory)!important;
            border:1px solid var(--lakas-gold)!important;box-shadow:0 4px 12px rgba(21,57,31,.12)
        }
        .navigation a:hover,.action a:hover,.continue-button:hover,button:hover,.next:hover {
            background:var(--lakas-forest)!important;transform:translateY(-1px);box-shadow:0 7px 16px rgba(21,57,31,.16)
        }
        .back {background:transparent!important;color:var(--lakas-green)!important;border:1px solid var(--lakas-green)!important}
        .choice {border:1px solid #d8d2bf!important;border-radius:9px!important;padding:16px!important;background:#fffdf7;line-height:1.65}
        .choice:hover {background:#f5f0df!important;border-color:var(--lakas-gold)!important}
        footer {background:var(--lakas-forest)!important;border-top:3px solid var(--lakas-gold);color:var(--lakas-ivory)!important}
        .lakas-progress {max-width:900px;margin:18px auto 0;padding:0 5%;display:flex;align-items:center;gap:7px;position:relative;z-index:1}
        .lakas-progress span {height:5px;flex:1;border-radius:9px;background:#ded8c7}
        .lakas-progress span.done {background:var(--lakas-gold)}
        .lakas-progress-label {text-align:center;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#746747;margin:8px 0 0}
        .lakas-divider {height:2px;width:58px;background:var(--lakas-gold);border:0;margin:15px 0 20px}
        .lakas-badges {display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:22px 0}
        .lakas-badges span {display:inline-flex;align-items:center;gap:7px;background:#f1ead7;border:1px solid #e3d5b3;color:var(--lakas-forest);border-radius:30px;padding:8px 13px;font-size:.84rem;font-weight:700}
        .lakas-icon {color:var(--lakas-gold);font-size:1.05em}

        .topbar .lakas-emblem {width:42px;flex:0 0 42px}
        .topbar strong {font-size:14px;line-height:1.25;letter-spacing:.04em}
        .topbar select {max-width:200px}

        .evaluation-panel p {margin-bottom:13px}
        .evaluation-panel .question-card {border-radius:10px}
        @media(max-width:600px) {
            body::before {background-size:135px auto;background-position:right -35px bottom 7vh;opacity:.045}

            header,.hero {padding:25px 15px!important}
            main {margin-top:26px!important;margin-bottom:30px!important}
            main>section,.section-card,.eligibility-card {padding:19px!important}
            .lakas-progress {gap:4px}
            .topbar {height:58px!important;padding:0 10px!important}
            .topbar .lakas-emblem {width:34px;flex-basis:34px}
            .topbar strong {font-size:11px}
        }

    
        /* Final identity and layout corrections */
        body::before {
            background-position:center center!important;
            background-size:min(220px,28vw) auto!important;
            opacity:.045!important;
        }
        header::after,.hero::after {
            left:50%!important;right:auto!important;bottom:-18px!important;
            transform:translateX(-50%)!important;
            width:145px!important;height:145px!important;
            opacity:.12!important;
        }
        .lakas-emblem {
            width:clamp(82px,9vw,104px)!important;
            margin-left:auto!important;margin-right:auto!important;
        }
        .topbar .lakas-emblem {
            width:50px!important;flex:0 0 50px!important;
            margin:0!important;
        }
        .lakas-brand {width:100%;justify-content:center!important}@media(max-width:600px){.lakas-emblem{width:78px!important}}

    
        /* Keep the prototype viewport completely unobstructed. */
        .model-viewer {
            border:0!important;outline:0!important;padding:0!important;margin:0!important;
            box-shadow:none!important;border-radius:0!important;overflow:hidden;
        }

        .review-answer-row button {color:#3d463f!important}
   
    
        /* Emblem positioning: centered gold watermark; compact official header emblem. */
        header::after,.hero::after {
            left:50%!important;right:auto!important;top:50%!important;bottom:auto!important;
            transform:translate(-50%,-50%)!important;
            width:clamp(150px,20vw,220px)!important;height:clamp(150px,20vw,220px)!important;
            opacity:.10!important;pointer-events:none!important;
        }

        .topbar > * {position:relative;z-index:1}
        .topbar .lakas-emblem {width:50px!important;flex:0 0 50px!important;margin:0!important}
        /* The green page watermark is intentionally omitted on the evaluation screen. */
  
    </style>
</head>

<body>

    <header class="topbar">
        <img class="lakas-emblem" src="assets/lakas-emblem-original.jpg" alt="PROJECT L.A.K.A.S. emblem"><strong>PROJECT L.A.K.A.S.</strong>

        <select id="designPicker" aria-label="Choose presentation">
        </select>
    </header>
    


    <main class="workspace" id="workspace">

        <section class="evaluation-panel" id="evaluationPanel">
            <div id="questionnaire">
                <h2>F1 Evaluation</h2>
                <p>Loading questionnaire...</p>
            </div>

            <!-- Final submission section -->
            <section
                class="submission-section"
                id="submissionSection"
                hidden
            >
                <h2>Review and Submit</h2>

                <p>
                    You have reached the final stage of the
                    F1 evaluation. Review your responses
                    before submitting.
                </p>

                <div
                    id="completionStatus"
                    role="status"
                    aria-live="polite"
                >
                    Complete all five design presentations
                    to unlock submission.
                </div>

                <button
                    type="button"
                    id="reviewResponsesButton"
                    disabled
                >
                    Review Responses
                </button>

                <button
                    type="button"
                    id="submitEvaluationButton"
                    disabled
                >
                    Submit Evaluation
                </button>

                <div
                    id="submissionStatus"
                    role="status"
                    aria-live="polite"
                ></div>
            </section>
        </section>

        <div class="divider" id="divider">
            <button
                id="collapseButton"
                aria-label="Collapse evaluation panel">
                &lt;
            </button>
        </div>

        <section class="model-viewer">
            <iframe
                id="modelFrame"
                title="Laksoy 3D presentation">
            </iframe>

            <!-- Project L.A.K.A.S. Apps Script submission bridge -->
            <iframe
                id="f1SubmissionBridge"
                name="f1SubmissionBridge"
                title="F1 Submission Bridge"
                aria-hidden="true"
                style="display: none;"
            ></iframe>
        </section>

    </main>

    <button
        class="drawer-toggle"
        id="drawerButton"
        aria-label="Open evaluation form">
        Evaluate →
    </button>

    <script src="config.js"></script>
    <script src="evaluation-test.js"></script>

    <script>
        const workspace =
            document.getElementById("workspace");

        const panel =
            document.getElementById("evaluationPanel");

        const divider =
            document.getElementById("divider");

        const collapseButton =
            document.getElementById("collapseButton");

        const drawerButton =
            document.getElementById("drawerButton");

        const modelFrame =
            document.getElementById("modelFrame");

        const designPicker =
            document.getElementById("designPicker");

        // Load presentation choices.
        const order = EVALUATION_CONFIG.sketchOrder;

        order.forEach(code => {
            const option = document.createElement("option");

            option.value = code;

            option.textContent =
                code + " - " +
                EVALUATION_CONFIG.materials[code].name;

            designPicker.appendChild(option);
        });

        // Load selected 3D model and questionnaire.
        function loadModel(code) {
            const material =
                EVALUATION_CONFIG.materials[code];

            if (!material || !material.modelFile) {
                alert("The selected model file is unavailable.");
                return;
            }

            modelFrame.src = material.modelFile;

            designPicker.value = code;

            const position = order.indexOf(code) + 1;

            renderF1Questionnaire(code, position);
        }

        // Allow response-review links in evaluation-test.js to use this same navigation.
        window.loadModel = loadModel;

        designPicker.addEventListener("change", () => {
            loadModel(designPicker.value);
        });

        // Load first presentation.
        if (order.length > 0) {
            loadModel(order[0]);
        }

        // Desktop panel collapse.
        collapseButton.addEventListener("click", () => {
            workspace.classList.toggle("collapsed");

            collapseButton.textContent =
                workspace.classList.contains("collapsed")
                    ? ">"
                    : "<";
        });

        // Mobile drawer.
        drawerButton.addEventListener("click", () => {
            panel.classList.add("open");
            drawerButton.classList.add("hidden");
        });

        // Close mobile drawer when tapping outside.
        document.addEventListener("click", (event) => {
            if (
                window.innerWidth <= 760 &&
                panel.classList.contains("open") &&
                !panel.contains(event.target) &&
                event.target !== drawerButton
            ) {
                panel.classList.remove("open");
                drawerButton.classList.remove("hidden");
            }
        });

        // Desktop divider resizing.
        let resizing = false;

        divider.addEventListener("pointerdown", (event) => {
            if (window.innerWidth <= 760) return;

            resizing = true;
            divider.setPointerCapture(event.pointerId);
        });

        divider.addEventListener("pointermove", (event) => {
            if (!resizing) return;

            const percentage =
                (event.clientX / window.innerWidth) * 100;

            if (percentage >= 25 && percentage <= 65) {
                panel.style.width = percentage + "%";
            }
        });

        divider.addEventListener("pointerup", () => {
            resizing = false;
        });

        divider.addEventListener("pointercancel", () => {
            resizing = false;
        });
    </script>

</body>
</html>
